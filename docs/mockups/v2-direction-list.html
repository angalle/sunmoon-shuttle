*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f6f9;--card:#fff;--fg:#17202a;--muted:#5b6b7c;--line:#e3e8ee;--brand:#0b5497;--brand-soft:#e8f1fa;--warn:#a8410b;--warn-bg:#fdf1e7;--ok:#0b6b3a;--radius:14px}
@media (prefers-color-scheme:dark){:root{--bg:#12161b;--card:#1a2027;--fg:#eef2f6;--muted:#9fb0c0;--line:#2a333d;--brand:#69b0ee;--brand-soft:#16283a;--warn:#f0b183;--warn-bg:#2c2118;--ok:#7fd1a2}}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);line-height:1.45;-webkit-font-smoothing:antialiased;padding:14px 12px 40px;max-width:520px;margin:0 auto}
h1{font-size:19px;letter-spacing:-.2px}
h2{font-size:14px;color:var(--muted);font-weight:600;margin:16px 0 8px}
.sub{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;min-height:36px}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.chip.sm{padding:5px 10px;font-size:12px;min-height:30px}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--brand-soft);color:var(--brand);vertical-align:middle}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.banner{border-radius:12px;padding:11px 13px;font-size:13px;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);margin-bottom:12px}
.banner.info{background:var(--brand-soft);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 26%,transparent)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.time{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;min-width:52px}
.dir{font-size:11px;color:var(--muted)}
.next{display:flex;align-items:baseline;gap:8px}
.next .t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cell{border:1px solid var(--line);border-radius:10px;padding:7px 8px;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.cell small{display:block;font-size:10px;color:var(--muted);font-weight:500}
.tl{position:relative;border-top:1px solid var(--line);height:34px}
.tl .lane{position:absolute;top:8px;height:8px;border-radius:4px;background:var(--brand-soft)}
.dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--brand);top:9px}
.dot.in{background:transparent;border:1.5px solid var(--brand)}
.now{position:absolute;top:0;bottom:0;width:2px;background:#d9480f}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.foot{font-size:11px;color:var(--muted);margin-top:14px}
details{margin-top:12px;font-size:12px;color:var(--muted)}
a{color:var(--brand)}
label{font-size:12px;color:var(--muted)}
input[type=time]{font:inherit;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg)}

const S=DATA,$=s=>document.querySelector(s);
$('#sem').textContent=S.semester.title;
const DAY={weekday:'평일/학기중',saturday:'토요일',sunday:'일요일/공휴일'};
const active=S.routes.filter(r=>r.status==='active');
let day='weekday',dir='out',route=active[0].id;
function render(){
 const r=active.find(x=>x.id===route), ev=(r.byDay[day]||[]).filter(e=>e.dir===dir).sort((a,b)=>a.t<b.t?-1:1);
 $('#rtitle').textContent=r.name+(r.path?` <span class="sub">${r.path.replace(/>/g,'›')}</span>`:'');
 $('#rcount').textContent=`${day==='weekday'?'평일':day} ${ev.length}편`;
 $('#grid').innerHTML=ev.map(e=>`<div class="cell">${e.t}<small>${e.arr||'—'} 도착</small>${e.note?`<span class="badge warn" style="margin-top:4px">${e.note}</span>`:''}</div>`).join('')||'<p class="sub">이 요일·방향은 운행 없음</p>';
}
$('#days').innerHTML=Object.entries(DAY).map(([k,l])=>`<button class="chip" data-x="day" data-v="${k}" aria-pressed="${k===day}">${l}</button>`).join('');
$('#dirs').innerHTML=[['out','학교 → 역/터미널'],['in','역/터미널 → 학교']].map(([k,l])=>`<button class="chip" data-x="dir" data-v="${k}" aria-pressed="${k===dir}">${l}</button>`).join('');
$('#routes').innerHTML=active.map(r=>`<button class="chip" data-x="route" data-v="${r.id}" aria-pressed="${r.id===route}">${r.name}</button>`).join('');

 document.querySelectorAll(`[data-x="${x}"]`).forEach(c=>c.setAttribute('aria-pressed',c===b)); render();};
render();
