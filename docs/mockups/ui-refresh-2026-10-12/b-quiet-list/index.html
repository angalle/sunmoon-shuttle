<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시안 B — Quiet List (선문대 셔틀)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --brand:#00347F; --brand-soft:#F2F6FC;
    --bg:#FFFFFF; --line:#EEF1F5; --line-strong:#E3E8EF;
    --text:#17202A; --muted:#5B6672; --dim:#8A94A0;
  }
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  .phone{max-width:390px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
  .fixed{flex:0 0 auto;background:#fff;padding:8px 14px 0;z-index:2}
  .appbar{display:flex;align-items:center;justify-content:space-between;height:48px}
  .clock{font-size:15px;font-weight:500;color:var(--muted)}
  .clock b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;margin-left:8px;font-size:16px}
  .icon{width:44px;height:44px;border:0;background:transparent;color:var(--dim);font-size:17px;border-radius:999px}
  .icon:hover{background:var(--brand-soft)}
  .daytabs{display:flex;gap:22px;height:42px;align-items:stretch;margin-top:2px}
  .daytabs button{position:relative;border:0;background:transparent;font:inherit;font-size:14px;color:var(--dim);cursor:pointer;padding:0}
  .daytabs button[aria-selected="true"]{color:var(--brand);font-weight:600}
  .daytabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--brand);border-radius:2px 2px 0 0}
  .today{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--brand);margin-left:5px;vertical-align:2px}
  .chips{display:flex;gap:8px;padding:10px 0 8px;border-bottom:1px solid var(--line)}
  .chip{height:32px;padding:0 13px;border-radius:999px;background:transparent;border:1px solid var(--line-strong);font:inherit;font-size:13px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;position:relative}
  .chip::after{content:"";position:absolute;inset:-6px 0;border-radius:999px}
  .chip span{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);font-weight:600;background:var(--brand-soft)}
  .chip[aria-pressed="true"] span{color:var(--brand);opacity:.7}
  .scroll{flex:1 1 auto;overflow-y:auto;padding:0 14px 96px;scroll-behavior:smooth}
  .group{margin-top:14px}
  .route{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.06em;padding:0 2px 6px;display:flex;justify-content:space-between}
  .route small{font-weight:400;letter-spacing:0}
  .rows{list-style:none}
  .row{display:flex;align-items:center;gap:12px;min-height:60px;border-top:1px solid var(--line);padding:9px 2px}
  .row:first-child{border-top:0}
  .t{width:56px;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--text)}
  .d{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .d b{font-size:14px;font-weight:500}
  .d small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .row.is-now .t{color:var(--brand)}
  .row.is-now .t::after{content:"";display:block;width:14px;height:2px;background:var(--brand);border-radius:2px;margin-top:4px}
  .row.is-now .d b::after{content:"다음";margin-left:8px;font-size:10.5px;font-weight:600;color:var(--brand);letter-spacing:.02em}
  .past{color:var(--dim)}
  .past .t{color:var(--dim);font-weight:500}
  .past .d small{color:var(--dim)}
  .fab{position:absolute;right:14px;bottom:18px;display:flex;flex-direction:column;gap:8px}
  .fab button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-strong);background:rgba(255,255,255,.95);color:var(--brand);font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="phone">
  <div class="fixed">
    <div class="appbar">
      <div class="clock">10월 12일 (일)<b>14:23</b></div>
      <button class="icon" aria-label="이용 안내">ⓘ</button>
    </div>
    <div class="daytabs" role="tablist" aria-label="요일 선택">
      <button role="tab" aria-selected="true">평일<span class="today" aria-label="오늘"></span></button>
      <button role="tab" aria-selected="false">토요일</button>
      <button role="tab" aria-selected="false">일요일</button>
    </div>
    <div class="chips">
      <button class="chip" aria-pressed="false" data-dir="in">학교 도착 <span>24</span></button>
      <button class="chip" aria-pressed="true" data-dir="out">터미널 도착 <span>91</span></button>
    </div>
  </div>
  <main class="scroll" id="list" aria-live="polite"></main>
  <div class="fab">
    <button title="현재 시간으로" aria-label="현재 시간으로">◷</button>
    <button title="맨 위로" aria-label="맨 위로">↑</button>
  </div>
</div>

<script>
const DATA = {
  out: [
    { route:'천안터미널', rows:[
      {t:'07:30', meta:'08:10 도착 · 약 40분', past:true},
      {t:'08:10', meta:'08:50 도착 · 약 40분', past:true},
      {t:'12:15', meta:'12:55 도착 · 약 40분'},
      {t:'16:00', meta:'16:40 도착 · 약 40분'},
      {t:'18:00', meta:'18:40 도착 · 약 40분'},
    ]},
    { route:'천안역', rows:[
      {t:'07:40', meta:'08:15 도착 · 약 35분', past:true},
      {t:'12:00', meta:'12:30 도착 · 약 30분'},
      {t:'16:00', meta:'16:30 도착 · 약 30분'},
      {t:'18:10', meta:'18:40 도착 · 약 30분'},
    ]},
    { route:'아산(KTX)역', rows:[
      {t:'08:05', meta:'08:40 도착 · 약 35분', now:true},
      {t:'12:00', meta:'12:20 도착 · 약 20분'},
      {t:'16:10', meta:'16:30 도착 · 약 20분'},
      {t:'19:45', meta:'20:20 도착 · 약 35분'},
    ]},
    { route:'온양역/터미널', rows:[
      {t:'17:30', meta:'18:25 도착 · 약 55분'},
      {t:'18:30', meta:'19:25 도착 · 약 55분'},
    ]},
  ],
  in: [
    { route:'아산(KTX)역', rows:[
      {t:'08:35', meta:'08:50 도착 · 약 15분'},
      {t:'09:00', meta:'09:15 도착 · 약 15분'},
      {t:'12:00', meta:'12:20 도착 · 약 20분'},
      {t:'18:20', meta:'18:40 도착 · 약 20분'},
    ]},
    { route:'천안터미널', rows:[
      {t:'08:15', meta:'08:55 도착 · 약 40분'},
      {t:'08:25', meta:'09:05 도착 · 약 40분'},
      {t:'17:30', meta:'18:25 도착 · 약 55분'},
    ]},
    { route:'천안역', rows:[
      {t:'08:30', meta:'09:00 도착 · 약 30분'},
      {t:'12:30', meta:'13:00 도착 · 약 30분'},
    ]},
  ],
};
function render(dir){
  const host=document.getElementById('list');
  host.innerHTML = DATA[dir].map(g=>`
    <section class="group">
      <h2 class="route">${g.route}<small>${g.rows.length}편</small></h2>
      <ul class="rows">
        ${g.rows.map(r=>`
          <li class="row ${r.now?'is-now':''} ${r.past?'past':''}">
            <span class="t">${r.t}</span>
            <div class="d"><b>${g.route}</b><small>${r.meta}</small></div>
          </li>`).join('')}
      </ul>
    </section>`).join('');
  const now=host.querySelector('.is-now');
  if(now) requestAnimationFrame(()=>now.scrollIntoView({block:'center'}));
}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));
  c.setAttribute('aria-pressed','true'); render(c.dataset.dir);
}));
document.querySelectorAll('.daytabs button').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.daytabs button').forEach(x=>x.setAttribute('aria-selected','false'));
  t.setAttribute('aria-selected','true');
}));
render('out');
</script>
</body>
</html>
