# scrape.yml — 원본 스냅샷 반입 파이프라인 (T3 · infraprojectcreator)
#
# ⚠️ schedule:(cron) 을 절대 넣지 않는다 — 의도적이다.
#    lily.sunmoon.ac.kr/robots.txt 의 `Disallow: /Page` 는 접두사 규칙이라 `/Page2/…`(우리 시간표 URL 전부)를
#    포함해 차단한다(실측, docs/01-architecture.md §8). 자동 크롤은 학교 허락 전 금지(결정 D5·D7).
#    정본 = **사람이 브라우저로 저장한 HTML 스냅샷을 data/raw/ 에 커밋 → 이 워크플로가 파싱·검증·반영**.
#    (자동 수집 경로를 코드에 남기지 않는다. 파서는 `--local` 로만 동작한다.)
#
# 흐름: workflow_dispatch(수동 트리거) → npm ci → 스냅샷 파싱(--local) → 계약 JSON 최소 검증 → 테스트
#       → 변경 감지(무변경이면 커밋 0건) → commit 또는 PR
# 불변식: 검증/테스트 실패 → **워크플로 실패**(조용한 통과 금지) · data/timetable.json 은 변경 시에만 커밋.
#
# ── 역할 분리(T15, 2026-10-06) ────────────────────────────────────────────────
#   scrape.yml (이 파일) : **수동 전용** — 사람이 저장한 새 원본 스냅샷을 반입·검증·반영한다. 스케줄 없음(그대로 유지).
#   extract.yml          : 스케줄 하루 2회 + 수동 dispatch — 규칙 재파싱 + AI 보강 + 검증 + 발행(배치 v2).
#   → 두 워크플로 모두 data/timetable.json 을 커밋할 수 있어 **concurrency group `data-publish` 를 공유**한다
#     (같은 그룹은 저장소 전역에서 직렬화 → push 경합/non-fast-forward 방지).
name: scrape

on:
  workflow_dispatch:
    inputs:
      raw_glob:
        description: '원본 스냅샷 경로(글롭). 사람이 저장해 커밋한 HTML'
        required: true
        default: 'data/raw/*.html'
      mode:
        description: '결과 반영 방식 (commit=main 에 직접 커밋 / pr=검토용 PR)'
        type: choice
        options: [commit, pr]
        default: commit
      reason:
        description: '반입 사유(커밋·PR 제목에 들어감)'
        required: false
        default: '수동 스냅샷 반입'
  # schedule: 없음(위 주석 참조). cron 을 추가하지 말 것.

permissions:
  contents: write          # 커밋/브랜치 push
  pull-requests: write     # mode=pr
  actions: write           # mode=commit 반영 후 deploy.yml 을 workflow_dispatch 로 시작(봇 push 는 on:push 를 안 깨움)

concurrency:
  group: data-publish    # extract.yml 과 공유 — data/timetable.json 발행을 직렬화한다(T15)
  cancel-in-progress: false

jobs:
  scrape:
    name: "scrape (--local → 검증 → 반영)"
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: Node 설정
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 원격 fetch 없음. 로컬 스냅샷만 파싱한다(자동 크롤 금지 — 파일 상단 주석).
      # 글롭은 셸에서 파일 목록으로 확장해 파서에 넘긴다(문서화된 사용법: npm run scrape -- --local data/raw/*.html).
      # 빈 매칭이면 조용히 넘어가지 않고 즉시 실패한다. while+read 로 파일명 공백/한글에도 안전(bash 3.2 호환).
      - name: 스냅샷 파싱 (--local)
        env:
          RAW_GLOB: ${{ inputs.raw_glob }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r f; do
            files+=("$f")
          done < <(compgen -G "$RAW_GLOB" || true)
          echo "매칭된 스냅샷: ${#files[@]}개"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=스냅샷 없음::${RAW_GLOB} 에 매칭되는 파일이 없다."
            exit 1
          fi
          printf ' - %s\n' "${files[@]}"
          npm run scrape -- --local "${files[@]}"

      # 계약 JSON **최소** 검증(docs/02 M3). 정밀 스키마·골든 검증은 파서(T2)·골든 테스트가 담당한다.
      - name: 계약 JSON 최소 검증
        run: node .github/scripts/verify_contract.mjs data/timetable.json

      - name: 테스트 (골든 포함 — 깨진 스냅샷이면 여기서 실패)
        run: npm run test

      # 변경 감지 — **내용** 변경만 커밋한다. `source.fetchedAt`(수집 시각)은 실행마다 달라지므로 제외하고 비교한다.
      # 실측(T2·T3b, 2026-10-05): 같은 입력으로 3회 파싱하면 fetchedAt 만 변동하고 나머지(행·셀·contentHash)는 결정적이다.
      #   → 원시 `git diff` 로 판정하면 매 실행마다 '수집 시각만 바뀐' 노이즈 커밋이 쌓인다(실측: fetchedAt 3회 상이 → 항상 changed).
      # fetchedAt 의 의미 = **"현재 커밋된 데이터를 반영한 시각"**(= 마지막 *내용* 변경 시각) → 내용 무변경이면 갱신하지 않는다.
      # 무변경이면 새 파일을 버리고(HEAD 복원) 커밋 0건으로 끝낸다(파싱·검증·테스트는 이미 통과했다).
      - name: 변경 감지 (fetchedAt 제외 — 내용 무변경이면 커밋 0건)
        id: diff
        run: |
          set -euo pipefail
          norm() { jq -S 'del(.source.fetchedAt)'; }
          if ! git cat-file -e "HEAD:data/timetable.json" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "기존 data/timetable.json 이 HEAD 에 없다(최초 반영) → 커밋한다"
          elif diff -q <(git show HEAD:data/timetable.json | norm) <(norm < data/timetable.json) >/dev/null; then
            git checkout -- data/timetable.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "fetchedAt 외 내용 동일 → 데이터 변경 없음 → 커밋 0건(fetchedAt 은 직전 내용 변경 시각을 유지)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "data/timetable.json 내용 변경 감지 → 커밋한다"
          fi

      - name: 반영 — main 커밋 (mode=commit)
        id: publish
        if: steps.diff.outputs.changed == 'true' && inputs.mode == 'commit'
        env:
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          SUMMARY="$(node .github/scripts/summarize.mjs data/timetable.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/timetable.json
          git commit -m "data: 스냅샷 반영 — ${SUMMARY} (${REASON})"
          git push
          echo "커밋·push 완료: ${SUMMARY}"

      # 데이터 커밋 뒤 Pages 배포를 **직접** 시작한다.
      # 이 워크플로가 GITHUB_TOKEN 으로 한 push 는 deploy.yml 의 `on: push` 를 깨우지 않는다(GitHub 의 재귀 방지 규칙).
      # 그래서 배치가 발행해도 사이트는 다음 코드 push 전까지 옛 JSON 이었다(2026-11-08 실측).
      # workflow_dispatch 는 GITHUB_TOKEN 으로도 시작할 수 있다 → 커밋이 실제로 나간 경우에만 deploy.yml 을 부른다.
      - name: 배포 시작 — deploy.yml (데이터 커밋이 나간 경우만)
        if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "deploy.yml 시작 요청 완료 — Actions 탭에서 배포 결과를 확인한다." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 반영 — 검토용 PR (mode=pr)
        if: steps.diff.outputs.changed == 'true' && inputs.mode == 'pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ inputs.reason }}
          RAW_GLOB: ${{ inputs.raw_glob }}
        run: |
          set -euo pipefail
          SUMMARY="$(node .github/scripts/summarize.mjs data/timetable.json)"
          BR="data/snapshot-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add data/timetable.json
          git commit -m "data: 스냅샷 반영 — ${SUMMARY} (${REASON})"
          git push -u origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "data: 스냅샷 반영 — ${SUMMARY}" \
            --body "수동 스냅샷 반입(workflow_dispatch, mode=pr). 사유: ${REASON} / 입력: ${RAW_GLOB} / 요약: ${SUMMARY}"
